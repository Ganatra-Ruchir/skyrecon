# SkyRecon — local / self-hosted stack.
#
#   cp .env.example .env
#   python -m app.cli genkeys >> .env      # then tidy the duplicated keys
#   docker compose up --build
#
# Default profile is SQLite on a named volume: one container, no database to
# operate. Add `--profile postgres` to run against PostgreSQL instead.

services:
  api:
    build: .
    image: skyrecon:2.0.0
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SKYRECON_ENV: production
      SKYRECON_DATABASE_URL: sqlite:////data/skyrecon.db
      SKYRECON_MASTER_KEY: ${SKYRECON_MASTER_KEY:?set SKYRECON_MASTER_KEY in .env}
      SKYRECON_JWT_SECRET: ${SKYRECON_JWT_SECRET:?set SKYRECON_JWT_SECRET in .env}
      SKYRECON_CORS_ORIGINS: ${SKYRECON_CORS_ORIGINS:-http://localhost:8000}
      SKYRECON_BOOTSTRAP_EMAIL: ${SKYRECON_BOOTSTRAP_EMAIL:-admin@skyrecon.local}
      SKYRECON_BOOTSTRAP_PASSWORD: ${SKYRECON_BOOTSTRAP_PASSWORD:-}
      SKYRECON_REQUIRE_ADMIN_MFA: ${SKYRECON_REQUIRE_ADMIN_MFA:-true}
    volumes:
      - skyrecon-data:/data
    # Nothing in the container needs to write outside /data.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 15s

  # ── optional PostgreSQL backend ────────────────────────────────────────
  api-pg:
    profiles: ["postgres"]
    build:
      context: .
      args:
        WITH_POSTGRES: "1"
    image: skyrecon:2.0.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      SKYRECON_ENV: production
      SKYRECON_DATABASE_URL: postgresql+psycopg://skyrecon:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/skyrecon
      SKYRECON_MASTER_KEY: ${SKYRECON_MASTER_KEY:?set SKYRECON_MASTER_KEY in .env}
      SKYRECON_JWT_SECRET: ${SKYRECON_JWT_SECRET:?set SKYRECON_JWT_SECRET in .env}
      SKYRECON_CORS_ORIGINS: ${SKYRECON_CORS_ORIGINS:-http://localhost:8000}
    security_opt:
      - no-new-privileges:true

  db:
    profiles: ["postgres"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skyrecon
      POSTGRES_USER: skyrecon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - skyrecon-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyrecon -d skyrecon"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  skyrecon-data:
  skyrecon-pg:
