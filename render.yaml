# Render blueprint — https://render.com/docs/blueprint-spec
#
# One click: New → Blueprint → point at this repo. Render builds the
# Dockerfile, attaches a 1 GB disk for the SQLite database, and generates the
# master key and JWT secret on first deploy.
#
# IMPORTANT: SKYRECON_MASTER_KEY is generated once and must then be copied to
# your own secret store. If the service is destroyed and recreated, a new key
# is generated and previously encrypted rows can no longer be opened — that is
# the design, not a bug.

services:
  - type: web
    name: skyrecon
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # `free` works too, but free instances have no disk
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: skyrecon-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SKYRECON_ENV
        value: production
      - key: SKYRECON_DATABASE_URL
        value: sqlite:////data/skyrecon.db
      - key: SKYRECON_MASTER_KEY
        generateValue: true      # 32-byte base64 — back this up immediately
      - key: SKYRECON_JWT_SECRET
        generateValue: true
      - key: SKYRECON_BOOTSTRAP_EMAIL
        value: admin@skyrecon.local
      - key: SKYRECON_BOOTSTRAP_PASSWORD
        sync: false              # leave blank: the app prints a strong one once
      - key: SKYRECON_REQUIRE_ADMIN_MFA
        value: "true"
      - key: SKYRECON_CORS_ORIGINS
        sync: false              # set to your own https origin
      - key: SKYRECON_RATE_LIMIT
        value: "120"
      - key: SKYRECON_RATE_WINDOW
        value: "60"
