# Fly.io — `fly launch --no-deploy` then:
#   fly volumes create skyrecon_data --size 1
#   fly secrets set SKYRECON_MASTER_KEY=... SKYRECON_JWT_SECRET=...
#   fly deploy

app = "skyrecon"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  SKYRECON_ENV = "production"
  SKYRECON_DATABASE_URL = "sqlite:////data/skyrecon.db"
  SKYRECON_REQUIRE_ADMIN_MFA = "true"

[[mounts]]
  source = "skyrecon_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Process-local rate limiting and the anomaly model assume a single writer.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "4s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"
