<title>SkyRecon Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --void:#0a0403; --bg:#100808; --surface:#170a09; --panel:#1e0d0b; --panel2:#250f0c; --raise:#320f0c;
  --line:#4a1a10; --line-soft:#2e120e;
  --ink:#f7ece7; --dim:#bfa79f; --faint:#8b6a61; --ghost:#5c4239;
  --lava:#a71d08; --hot:#e73b0d; --gold:#fbc856; --moss:#7f9e6a; --ash:#8aa3c0;
  --crit:#e73b0d; --high:#c1381a; --med:#fbc856; --low:#7f9e6a;
  --crit-w:rgba(231,59,13,.12); --high-w:rgba(167,29,8,.16); --med-w:rgba(251,200,86,.12); --low-w:rgba(127,158,106,.12);
  --glow:0 0 22px rgba(231,59,13,.20);
  --r:8px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  color:var(--ink);font-family:'Barlow',-apple-system,'Segoe UI',sans-serif;font-size:13.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:
    radial-gradient(900px 500px at 88% -8%,rgba(167,29,8,.10),transparent 60%),
    radial-gradient(700px 420px at -6% 96%,rgba(109,19,8,.14),transparent 62%),var(--bg);
  background-attachment:fixed;
}
h1,h2,h3,h4{font-family:'Archivo',sans-serif;margin:0;letter-spacing:-.015em;color:#fff6f1;text-wrap:balance}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
::selection{background:rgba(231,59,13,.32);color:#fff}
button,input,textarea,select{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a1611;border-radius:9px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#571e13}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── shell ─────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:214px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--surface),#120706);border-right:1px solid var(--line-soft);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px 14px;border-bottom:1px solid var(--line-soft)}
.brand svg{flex:none}
.brand-n{font-family:'Archivo',sans-serif;font-weight:800;font-size:14.5px;letter-spacing:.06em;color:#fff6f1}
.brand-s{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.17em;color:var(--faint);margin-top:1px}
.nav{padding:10px 8px;flex:1}
.nav-g{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.18em;color:#6d4b41;padding:12px 8px 5px}
.nav-i{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:6px;cursor:pointer;color:var(--dim);
  font-size:12.5px;font-weight:500;position:relative;transition:background .14s,color .14s}
.nav-i svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.nav-i:hover{background:#1f0c09;color:#f3ded6}
.nav-i.on{background:linear-gradient(90deg,rgba(167,29,8,.30),rgba(167,29,8,.05));color:#fff1ea}
.nav-i.on::before{content:"";position:absolute;left:-8px;top:5px;bottom:5px;width:2px;background:var(--hot);border-radius:2px;box-shadow:var(--glow)}
.nav-i.on svg{color:var(--hot)}
.nav-c{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--faint)}
.nav-c.hot{color:var(--hot)}
.side-f{border-top:1px solid var(--line-soft);padding:10px 12px 12px}
.store-pill{display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--faint);letter-spacing:.04em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--moss);flex:none;box-shadow:0 0 8px rgba(127,158,106,.7)}
.dot.warn{background:var(--gold);box-shadow:0 0 8px rgba(251,200,86,.6)}
.dot.off{background:#5c4239;box-shadow:none}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(16,8,8,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);
  padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:15.5px;font-weight:700}
.top .sub{font-size:11.5px;color:var(--faint)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.canvas{padding:16px 18px 60px;min-width:0}

/* ── primitives ────────────────────────────────────────── */
.grid{display:grid;gap:12px;margin-bottom:12px}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}.g11{grid-template-columns:1fr 1fr}
.g111{grid-template-columns:repeat(3,1fr)}
@media(max-width:1150px){.g21,.g12,.g11,.g111{grid-template-columns:1fr}}
.pan{background:linear-gradient(180deg,var(--panel),var(--surface));border:1px solid var(--line-soft);border-radius:var(--r);min-width:0}
.pan-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line-soft)}
.pan-h h3{font-size:12.5px;font-weight:600;color:#f0dcd4;display:flex;align-items:center;gap:8px}
.pan-b{padding:13px}
.pan-b.flush{padding:0}
.hint{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--faint);letter-spacing:.05em}

.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 11px;font-size:12px;cursor:pointer;
  color:#e2c9c0;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#6d2312;color:#fff;background:#2d100c}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(180deg,#b52310,#8a1806);border-color:#c33517;color:#fff3ec;font-weight:600}
.btn.pri:hover{box-shadow:var(--glow)}
.btn.gold{background:rgba(251,200,86,.12);border-color:rgba(251,200,86,.35);color:var(--gold)}
.btn.sm{padding:4px 8px;font-size:11px}
.btn.danger{color:#f0907c;border-color:rgba(231,59,13,.35)}

.tag{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:9.5px;
  padding:2px 7px;border-radius:4px;letter-spacing:.05em;border:1px solid transparent;white-space:nowrap}
.t-crit{color:#ff9377;background:var(--crit-w);border-color:rgba(231,59,13,.35)}
.t-high{color:#ec8f74;background:var(--high-w);border-color:rgba(193,56,26,.35)}
.t-med{color:var(--gold);background:var(--med-w);border-color:rgba(251,200,86,.3)}
.t-low{color:#a7c290;background:var(--low-w);border-color:rgba(127,158,106,.3)}
.t-mut{color:var(--faint);background:#1c0b09;border-color:var(--line-soft)}
.t-gold{color:var(--gold);background:var(--med-w);border-color:rgba(251,200,86,.3)}
.t-ash{color:var(--ash);background:rgba(138,163,192,.10);border-color:rgba(138,163,192,.28)}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;color:#8a5f52;
  padding:8px 12px;border-bottom:1px solid var(--line-soft);background:#150807;white-space:nowrap;position:sticky;top:0}
tbody td{padding:8px 12px;border-bottom:1px solid var(--line-soft);font-size:12.5px;vertical-align:middle}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:#22100c}
tbody tr:last-child td{border-bottom:none}
.sevbar{display:inline-block;width:3px;height:15px;border-radius:2px;vertical-align:-3px;margin-right:8px}
.rb{display:inline-flex;align-items:center;gap:8px}
.rb u{display:block;width:46px;height:3px;background:#2c110d;border-radius:3px;overflow:hidden;text-decoration:none}
.rb u i{display:block;height:100%;width:0;border-radius:3px;transition:width .8s cubic-bezier(.22,1,.36,1)}
.rb b{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:500;color:#e8d2c9}
.val{font-family:'JetBrains Mono',monospace;font-size:12px;color:#f0b79c;word-break:break-all}

/* metrics */
.strip{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line-soft);border-radius:var(--r);
  background:linear-gradient(180deg,var(--panel),var(--surface));overflow:hidden;margin-bottom:12px}
@media(max-width:1000px){.strip{grid-template-columns:repeat(3,1fr)}}
.mt{padding:11px 13px;border-right:1px solid var(--line-soft)}
.mt:last-child{border-right:none}
.mt-l{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.11em;color:var(--faint)}
.mt-v{font-family:'Archivo',sans-serif;font-weight:800;font-size:22px;color:#fff6f1;line-height:1.2;margin-top:3px;letter-spacing:-.02em}
.mt-s{font-size:10.5px;color:var(--ghost);font-family:'JetBrains Mono',monospace}

/* empty states — the console shows nothing until the analyst supplies data */
.empty{text-align:center;padding:46px 22px;color:var(--faint)}
.empty svg{width:34px;height:34px;stroke:#5c2418;fill:none;stroke-width:1.2;margin-bottom:12px}
.empty h4{font-size:14px;color:#d9beb3;margin-bottom:6px;font-family:'Archivo',sans-serif}
.empty p{font-size:12.5px;max-width:44ch;margin:0 auto 14px;line-height:1.6}

/* ingest */
.ing{display:grid;grid-template-columns:1fr 300px;gap:12px}
@media(max-width:1000px){.ing{grid-template-columns:1fr}}
textarea.paste{width:100%;min-height:230px;background:#0b0504;border:1px solid var(--line-soft);border-radius:7px;
  padding:12px 13px;color:#e9d6cd;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.65;resize:vertical;outline:none}
textarea.paste:focus{border-color:rgba(231,59,13,.5);box-shadow:0 0 0 3px rgba(231,59,13,.08)}
textarea.paste::placeholder{color:#573c33}
.seg{display:inline-flex;background:#170a08;border:1px solid var(--line-soft);border-radius:6px;overflow:hidden}
.seg b{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;padding:6px 11px;cursor:pointer;color:var(--faint);
  border-right:1px solid var(--line-soft);transition:.14s}
.seg b:last-child{border-right:none}
.seg b:hover{color:var(--ink);background:#22100c}
.seg b.on{background:rgba(167,29,8,.3);color:#ffd9cb}
.drop{border:1px dashed #562014;border-radius:7px;padding:14px;text-align:center;color:var(--faint);font-size:12px;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--hot);color:var(--dim);background:rgba(231,59,13,.05)}

.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kv div{background:#1a0b09;border:1px solid var(--line-soft);border-radius:6px;padding:7px 10px}
.kv u{display:block;text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.12em;color:var(--faint)}
.kv b{display:block;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500;color:#eeddd5;margin-top:2px;word-break:break-all}

/* factor ledger — the arithmetic behind a score */
.ledger{border:1px solid var(--line-soft);border-radius:7px;overflow:hidden;margin-top:8px}
.ledger .lr{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid var(--line-soft);font-size:12px}
.ledger .lr:last-child{border-bottom:none}
.ledger .lr.total{background:#1c0b09;font-weight:600}
.ledger .lname{flex:none;width:168px;color:#e0c7bd}
.ledger .ldet{flex:1;color:var(--faint);font-size:11.5px;min-width:0}
.ledger .ldelta{font-family:'JetBrains Mono',monospace;font-size:12px;flex:none;width:44px;text-align:right}
.pos{color:#ff9377}.neg{color:var(--moss)}

/* bars */
.bar{height:5px;background:#2c110d;border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:0;border-radius:4px;transition:width .8s cubic-bezier(.22,1,.36,1)}
.brow{margin-bottom:10px}
.brow .bl{display:flex;justify-content:space-between;font-size:11.5px;color:#c8ab9f}
.brow .bl span:last-child{font-family:'JetBrains Mono',monospace;color:var(--dim)}

/* graph */
.gwrap{position:relative;background:
  radial-gradient(600px 300px at 50% 45%,rgba(167,29,8,.07),transparent 70%),
  repeating-linear-gradient(0deg,transparent 0 25px,rgba(74,26,16,.22) 25px 26px),
  repeating-linear-gradient(90deg,transparent 0 25px,rgba(74,26,16,.22) 25px 26px),#130807;
  border-radius:0 0 var(--r) var(--r);overflow:hidden}
.gwrap svg{display:block;width:100%;height:440px}
.gnode{cursor:pointer}
.gnode .ring{opacity:0;transition:opacity .2s}
.gnode:hover .ring,.gnode.on .ring{opacity:1}
.gnode.on{filter:drop-shadow(0 0 9px rgba(231,59,13,.5))}
.gedge{stroke:#4a1a10;stroke-width:1.1;transition:stroke .2s,opacity .2s}
.gedge.lit{stroke:var(--hot);opacity:1}
.gedge.dim{opacity:.2}
.glab{font-family:'JetBrains Mono',monospace;font-size:8px;fill:#7a5348;letter-spacing:.04em}
.gname{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:#e3cbc1}
.gsub{font-family:'JetBrains Mono',monospace;font-size:8px;fill:#8b6a61}

/* rules */
.rule-card{border:1px solid var(--line-soft);border-radius:7px;padding:11px 13px;margin-bottom:9px;background:var(--panel)}
.rule-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rule-name{font-weight:600;font-size:12.5px;color:#f0dcd4;flex:1}
.expr-in{width:100%;background:#0b0504;border:1px solid var(--line-soft);border-radius:6px;padding:8px 10px;
  color:#f0b79c;font-family:'JetBrains Mono',monospace;font-size:12px;outline:none}
.expr-in:focus{border-color:rgba(231,59,13,.5)}
.expr-in.bad{border-color:var(--crit)}
.parse-msg{font-family:'JetBrains Mono',monospace;font-size:10.5px;margin-top:5px}
.parse-ok{color:var(--moss)}.parse-bad{color:#ff9377}
.sw{width:32px;height:18px;border-radius:20px;background:#2c110d;border:1px solid var(--line);position:relative;cursor:pointer;flex:none;transition:.18s}
.sw::after{content:"";position:absolute;top:1.5px;left:1.5px;width:13px;height:13px;border-radius:50%;background:#6b4a40;transition:.18s}
.sw.on{background:rgba(127,158,106,.22);border-color:rgba(127,158,106,.5)}
.sw.on::after{transform:translateX(14px);background:var(--moss);box-shadow:0 0 8px rgba(127,158,106,.6)}

/* matrix */
.mtx{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px}
.mcol h4{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;color:#8a5f52;padding-bottom:7px;font-weight:500}
.tcell{border:1px solid var(--line-soft);background:var(--panel2);border-radius:6px;padding:9px 10px;margin-bottom:7px;cursor:pointer;transition:.15s}
.tcell:hover{transform:translateY(-1px);border-color:#6d2312}
.tcell .tid{font-family:'JetBrains Mono',monospace;font-size:11px;color:#eddbd3;font-weight:500}
.tcell .tnm{font-size:11px;color:var(--faint);margin:1px 0 6px;line-height:1.3}
.tcell .tct{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--dim)}

/* flyout */
.scrim{position:fixed;inset:0;background:rgba(6,3,2,.66);opacity:0;pointer-events:none;transition:opacity .22s;z-index:60;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.fly{position:fixed;top:0;right:0;height:100%;width:min(500px,95vw);background:linear-gradient(180deg,#1a0b09,#120706);
  border-left:1px solid var(--line);box-shadow:-30px 0 70px rgba(0,0,0,.6);transform:translateX(100%);
  transition:transform .3s cubic-bezier(.22,1,.36,1);z-index:70;overflow-y:auto}
.fly.on{transform:none}
.fly-h{position:sticky;top:0;background:#1a0b09;border-bottom:1px solid var(--line-soft);padding:15px 17px 13px;z-index:2}
.fly-x{position:absolute;top:13px;right:13px;width:26px;height:26px;border-radius:6px;background:#250f0c;border:1px solid var(--line);cursor:pointer;color:var(--dim);font-size:13px;line-height:1}
.fly-x:hover{color:var(--hot);border-color:#6d2312}
.fly-b{padding:14px 17px 44px}
.sech{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;color:var(--faint);margin:16px 0 8px}
.gauge{position:relative;width:78px;height:78px;flex:none}
.gauge svg{transform:rotate(-90deg);display:block}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Archivo',sans-serif;font-weight:800;font-size:20px;color:#fff}
.note{background:#1a0b09;border-left:2px solid var(--lava);border-radius:0 6px 6px 0;padding:10px 12px;font-size:12.5px;color:#cdb1a6;line-height:1.55}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}

/* toasts */
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:95}
.toast{background:#250f0c;border:1px solid var(--line);border-left:2px solid var(--hot);border-radius:6px;padding:9px 14px;
  font-size:12.5px;color:#eddbd3;box-shadow:0 14px 34px rgba(0,0,0,.5);animation:tin .26s cubic-bezier(.22,1,.36,1) both;max-width:340px}
@keyframes tin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.toast.out{animation:tout .2s ease forwards}
@keyframes tout{to{opacity:0;transform:translateX(8px)}}

/* misc */
.list-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}
.list-row:last-child{border-bottom:none}
.list-row:hover .lname2{color:var(--hot)}
.lname2{flex:1;min-width:0;font-size:12.5px;color:#dcc3b9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .14s}
.lmeta{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--faint);flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:16px;border:1px solid var(--line-soft);background:var(--panel);font-size:11.5px;cursor:pointer;transition:.14s;color:var(--dim)}
.chip:hover{border-color:#6d2312;color:var(--ink)}
.chip.on{background:rgba(167,29,8,.3);border-color:#8a1e0c;color:#ffd9cb}
.mini-doc{font-size:12.5px;color:#c3a89e;line-height:1.65}
.mini-doc code{font-family:'JetBrains Mono',monospace;font-size:11.5px;background:#1c0b09;padding:1px 5px;border-radius:4px;color:#f0b79c}
.mini-doc p{margin:0 0 9px}
.term{background:#0a0504;border:1px solid var(--line-soft);border-radius:7px;max-height:300px;overflow-y:auto;padding:10px 12px;
  font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.75;color:#b39c93}
.term .tl{display:flex;gap:10px;border-bottom:1px solid rgba(46,18,14,.6);padding:2px 0}
.term .tl b{color:#6d4b41;font-weight:400;flex:none}
@media(max-width:900px){
  .app{grid-template-columns:56px 1fr}
  .brand-n,.brand-s,.nav-i span:not(.nav-c),.nav-g,.store-pill span{display:none}
  .nav-i{justify-content:center}
  .canvas{padding:14px 12px 50px}
}
</style>

<div class="app">
  <aside class="side">
    <div class="brand" id="brandMark"></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-f">
      <div class="store-pill" id="storePill"><i class="dot off"></i><span>checking store…</span></div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h1 id="ptitle">Ingest</h1><div class="sub" id="psub"></div></div>
      <div class="top-r" id="topActions"></div>
    </header>
    <main class="canvas" id="canvas"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="fly" id="fly"></div>
<div class="toasts" id="toasts"></div>

<script>/*__ENGINE__*/</script>
<script>
(function(){
'use strict';
const S = window.SkyRecon;
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US');
const SEVC={critical:'#e73b0d',high:'#c1381a',medium:'#fbc856',low:'#7f9e6a'};
const SEVT={critical:'t-crit',high:'t-high',medium:'t-med',low:'t-low'};

/* ── workspace: the analyst's own data, nothing pre-loaded ───────────── */
const WS = { indicators:[], alerts:[], events:[], rules:S.DEFAULT_RULES.map(r=>({...r})), ingests:[], meta:{created:null} };
let DB=null, storeMode='local', dirty=false;

function lsGet(k,d){ try{ const v=localStorage.getItem('skyrecon.'+k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem('skyrecon.'+k, JSON.stringify(v)); }catch(e){} }

async function initStore(){
  try { DB = await claude.use('db'); } catch(e){ DB=null; }
  if (DB){
    storeMode='cloud';
    try{
      const snap = await DB.doc('store/workspace').get();
      if (snap.exists && snap.data){
        const d = snap.data;
        WS.indicators = d.indicators||[]; WS.alerts = d.alerts||[]; WS.events = d.events||[];
        WS.rules = (d.rules&&d.rules.length)?d.rules:WS.rules; WS.ingests = d.ingests||[]; WS.meta = d.meta||WS.meta;
      }
      DB.doc('store/workspace').onSnapshot(snap=>{
        if(!snap.exists||!snap.data||snap.hasPendingWrites) return;
        const d=snap.data;
        if((d.rev||0) > (WS.meta.rev||0)){
          WS.indicators=d.indicators||[]; WS.alerts=d.alerts||[]; WS.events=d.events||[];
          WS.rules=d.rules||WS.rules; WS.ingests=d.ingests||[]; WS.meta=d.meta||WS.meta;
          render(); toast('Workspace updated from another session');
        }
      }, ()=>{});
    }catch(e){ storeMode='local'; }
  }
  if (storeMode==='local'){
    const d = lsGet('workspace', null);
    if (d){ WS.indicators=d.indicators||[]; WS.alerts=d.alerts||[]; WS.events=d.events||[];
            WS.rules=(d.rules&&d.rules.length)?d.rules:WS.rules; WS.ingests=d.ingests||[]; WS.meta=d.meta||WS.meta; }
  }
  paintStore();
  render();
}
function paintStore(){
  const p=$('#storePill');
  const n=WS.indicators.length;
  if(storeMode==='cloud') p.innerHTML='<i class="dot"></i><span>workspace store · '+n+' IOC</span>';
  else p.innerHTML='<i class="dot warn"></i><span>this browser only · '+n+' IOC</span>';
}
let saveTimer=null;
function persist(){
  WS.meta.rev=(WS.meta.rev||0)+1; WS.meta.updated=Date.now();
  if(!WS.meta.created) WS.meta.created=Date.now();
  paintStore();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    // keep the document inside the 256KB cap: newest first, bounded
    const payload={
      indicators:WS.indicators.slice(0,600),
      alerts:WS.alerts.slice(0,400),
      events:WS.events.slice(0,400).map(e=>({ts:e.ts,type:e.type,src:e.src,dst:e.dst,user:e.user,bytesOut:e.bytesOut,outcome:e.outcome,status:e.status})),
      rules:WS.rules, ingests:WS.ingests.slice(0,40), meta:WS.meta
    };
    if(storeMode==='cloud'&&DB){
      try{ await DB.doc('store/workspace').set(payload); }
      catch(e){ storeMode='local'; lsSet('workspace',payload); paintStore(); toast('Cloud store unavailable — saved in this browser'); }
    } else lsSet('workspace',payload);
  },600);
}

/* ── ingest pipeline: everything below is computed from analyst input ── */
function ingest(text, source, label){
  const t0=performance.now();
  const ex = S.extract(text);
  const logs = S.parseLogs(text);
  const now = Date.now();

  // merge indicators, tracking first/last seen and true sighting counts
  let added=0, updated=0;
  ex.indicators.forEach(item=>{
    const key=item.type+'|'+item.value.toLowerCase();
    let rec=WS.indicators.find(r=>r.key===key);
    if(rec){ rec.sightings+=item.count; rec.lastSeen=now; rec.sources=Array.from(new Set([...(rec.sources||[]),source])); updated++; }
    else { rec={key,type:item.type,value:item.value,sightings:item.count,firstSeen:now,lastSeen:now,sources:[source],benign:false};
           WS.indicators.push(rec); added++; }
    const sc=S.scoreIndicator({type:rec.type,value:rec.value},{source,sightings:rec.sightings});
    rec.risk=rec.benign?0:sc.risk; rec.confidence=sc.confidence; rec.severity=rec.benign?'low':sc.severity; rec.factors=sc.factors;
  });

  // events from any log lines present in the same paste
  if(logs.events.length){
    logs.events.forEach(e=>WS.events.unshift(e));
    WS.events=WS.events.slice(0,2000);
  }

  // rules run over the whole workspace so scores stay consistent
  recomputeAlerts();

  const rec={id:'ING-'+(WS.ingests.length+1).toString().padStart(3,'0'),at:now,source,label:label||'pasted input',
    chars:text.length, extracted:ex.indicators.length, dropped:ex.dropped.length, added, updated,
    logLines:logs.lineCount, parsedEvents:logs.events.length, unparsed:logs.unparsed.length,
    formats:Object.keys(logs.formats), ms:Math.round(performance.now()-t0)};
  WS.ingests.unshift(rec);
  persist();
  return {rec, ex, logs};
}

function recomputeAlerts(){
  const live=WS.indicators.filter(i=>!i.benign);
  const scores=live.map(i=>({risk:i.risk,confidence:i.confidence,severity:i.severity,factors:i.factors||[]}));
  const iocAlerts=S.runRules(WS.rules, live.map(i=>({type:i.type,value:i.value})), scores).filter(a=>!a.ruleError);
  const analysis=WS.events.length?S.analyseEvents(WS.events):{bruteForce:[],transfers:[],rareDest:[],hosts:{},stats:{}};
  const evAlerts=S.runEventRules(analysis);
  const stamp=Date.now();
  const merged=[...iocAlerts,...evAlerts].map((a,i)=>{
    const prev=WS.alerts.find(p=>p.ruleId===a.ruleId&&p.indicator===a.indicator);
    return {...a, id:prev?prev.id:'ALT-'+(stamp%100000)+'-'+i, at:prev?prev.at:stamp,
            status:prev?prev.status:'open', note:prev?prev.note:''};
  });
  WS.alerts=merged.sort((a,b)=>({critical:0,high:1,medium:2,low:3})[a.severity]-({critical:0,high:1,medium:2,low:3})[b.severity]||b.risk-a.risk);
  WS.analysis=analysis;
}

function histogram(){
  const buckets=Array.from({length:10},()=>0);
  WS.indicators.filter(i=>!i.benign).forEach(i=>buckets[Math.min(9,Math.floor(i.risk/10))]++);
  const max=Math.max(1,...buckets);
  return '<div style="display:flex;align-items:flex-end;gap:5px;height:150px">'+buckets.map((n,i)=>{
    const h=Math.round(n/max*128), c=i>=8?'#e73b0d':i>=6?'#c1381a':i>=4?'#fbc856':'#7f9e6a';
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px" title="${n} indicator(s) scoring ${i*10}-${i*10+9}">
      <div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;color:${n?'#bfa79f':'#5c4239'}">${n||''}</div>
      <div style="width:100%;height:${h}px;background:${c};border-radius:2px 2px 0 0;opacity:${n?1:.18};min-height:2px"></div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:8.5px;color:#8b6a61">${i*10}</div></div>`;
  }).join('')+'</div>';
}

V.graph=()=>{
  const g=S.buildGraph(WS.indicators.filter(i=>!i.benign),WS.events);
  if(!g.nodes.length) return emptyState('No entities to graph',
    'The graph is built from relationships actually observed in your data — a URL to its host, a source address to the destination it contacted, an account to the host it authenticated on.',
    '<button class="btn pri" data-goto="ingest">Go to Ingest</button>');

  // deterministic tiered layout: kind decides the column, risk decides the order
  const order=['zone','account','host','ip','domain','url','email','sha256','sha1','md5','cve'];
  const cols={};
  g.nodes.forEach(n=>{ (cols[n.kind]||(cols[n.kind]=[])).push(n); });
  const kinds=Object.keys(cols).sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  const W=980,H=430,pad=64;
  const colX=kinds.length>1?kinds.map((k,i)=>pad+i*((W-pad*2)/(kinds.length-1))):[W/2];
  const pos={};
  kinds.forEach((k,ci)=>{
    const list=cols[k].sort((a,b)=>(b.risk||0)-(a.risk||0)).slice(0,14);
    list.forEach((n,i)=>{
      const step=(H-90)/Math.max(1,list.length);
      pos[n.id]={x:colX[ci], y:52+step*i+step/2, kind:k, node:n};
    });
  });
  const KC={ip:'#e73b0d',domain:'#c1381a',url:'#a71d08',host:'#fbc856',account:'#8aa3c0',email:'#c1381a',
            sha256:'#7f9e6a',sha1:'#7f9e6a',md5:'#7f9e6a',cve:'#fbc856',zone:'#8b6a61'};
  const edges=g.edges.filter(e=>pos[e.src]&&pos[e.dst]).map(e=>{
    const a=pos[e.src],b=pos[e.dst];
    return `<g data-edge="${esc(e.src)}|${esc(e.dst)}"><line class="gedge" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>
      <text class="glab" x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-4}" text-anchor="middle">${e.rel}</text></g>`;}).join('');
  const nodes=Object.values(pos).map(p=>{
    const n=p.node, c=KC[p.kind]||'#8b6a61', r=n.risk>=85?17:n.risk>=65?15:13;
    return `<g class="gnode${selNode===n.id?' on':''}" data-node="${esc(n.id)}" transform="translate(${p.x},${p.y})">
      <circle class="ring" r="${r+8}" fill="none" stroke="${c}" stroke-opacity=".45"/>
      <circle r="${r}" fill="#150807" stroke="${c}" stroke-width="1.5"/>
      <circle r="${r-5}" fill="${c}" fill-opacity="${n.risk>=65?.35:.16}"/>
      <text class="gname" y="${r+13}" text-anchor="middle">${esc(trunc(n.id,20))}</text>
      <text class="gsub" y="${r+23}" text-anchor="middle">${p.kind}${n.risk!=null?' · '+n.risk:''}</text></g>`;}).join('');
  const sel=selNode?g.nodes.find(n=>n.id===selNode):null;
  const nbrs=sel?g.edges.filter(e=>e.src===sel.id||e.dst===sel.id):[];
  return `<div class="grid" style="grid-template-columns:1fr 280px;gap:12px">
    <div class="pan"><div class="pan-h"><h3>Observed relationships</h3>
      <span class="hint">${g.nodes.length} ENTITIES · ${g.edges.length} EDGES</span></div>
      <div class="gwrap"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${edges}${nodes}</svg>
        <div style="position:absolute;left:12px;bottom:10px;background:rgba(19,8,7,.85);border:1px solid var(--line-soft);border-radius:6px;padding:6px 9px;display:flex;gap:11px;flex-wrap:wrap">
          ${kinds.map(k=>`<span class="hint" style="display:inline-flex;align-items:center;gap:5px"><i style="width:7px;height:7px;border-radius:2px;background:${KC[k]||'#8b6a61'};display:inline-block"></i>${k.toUpperCase()}</span>`).join('')}
        </div></div></div>
    <div class="pan"><div class="pan-h"><h3>Entity</h3></div><div class="pan-b">
      ${sel?`<div class="val" style="font-size:13px">${esc(sel.id)}</div>
        <div class="kv"><div><u>KIND</u><b>${sel.kind}</b></div><div><u>RISK</u><b>${sel.risk!=null?sel.risk:'not scored'}</b></div></div>
        <div class="sech">CONNECTED</div>
        ${nbrs.length?nbrs.map(e=>`<div class="list-row" data-node2="${esc(e.src===sel.id?e.dst:e.src)}">
          <span class="lname2 mono" style="font-size:11.5px">${esc(trunc(e.src===sel.id?e.dst:e.src,22))}</span>
          <span class="lmeta">${e.rel}</span></div>`).join(''):noneYet('No edges recorded.')}`
      :'<div class="hint">Select a node to inspect it.</div>'}
    </div></div>
  </div>`;
};

V.attack=()=>{

    'T1071.001':'Command & Control','T1105':'Command & Control','T1571':'Command & Control',
    'T1583.001':'Resource Development','T1588.006':'Resource Development','T1110':'Credential Access','T1041':'Exfiltration'};
  const NAME={'T1566.002':'Spearphishing Link','T1568.002':'Domain Generation Algorithms','T1071':'Application Layer Protocol',
    'T1071.001':'Web Protocols','T1105':'Ingress Tool Transfer','T1571':'Non-Standard Port',
    'T1583.001':'Acquire Infrastructure: Domains','T1588.006':'Obtain Capabilities: Vulnerabilities',
    'T1110':'Brute Force','T1041':'Exfiltration Over C2 Channel'};
  const counts={}; WS.alerts.forEach(a=>counts[a.technique]=(counts[a.technique]||0)+1);
  const all=Array.from(new Set([...WS.rules.map(r=>r.technique),...S.EVENT_RULES.map(r=>r.technique)]));
  const byTactic={};
  all.forEach(t=>{const k=TACTIC[t]||'Other';(byTactic[k]||(byTactic[k]=[])).push(t);});
  const max=Math.max(1,...Object.values(counts));
  const fired=Object.keys(counts).length;
  return `<div class="pan"><div class="pan-h"><h3>Technique coverage</h3>
    <span class="hint">${fired} OF ${all.length} TECHNIQUES EVIDENCED BY FIRED RULES</span></div>

    <div class="mtx">${Object.entries(byTactic).map(([tac,techs])=>`<div class="mcol"><h4>${tac.toUpperCase()}</h4>
      ${techs.map(t=>{const c=counts[t]||0;const pct=Math.round(c/max*100);
      return `<div class="tcell" data-tech="${t}"><div class="tid">${t}</div><div class="tnm">${NAME[t]||''}</div>
        <div class="tct">${c} alert${c===1?'':'s'}</div>

};

           stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><b>${i.risk}</b></div>
       <div><div class="hint" style="letter-spacing:.1em">COMPOSITE RISK</div>
         <div style="font-size:12.5px;color:#c8ab9f;margin-top:3px">Confidence ${S.decayConfidence(i.confidence,i.lastSeen,Date.now())}% after decay (${i.confidence}% at last sighting)</div>
         <div class="hint" style="margin-top:4px">first seen ${rel(i.firstSeen)} · last ${rel(i.lastSeen)}</div></div>
     </div>
     <div class="sech">SCORE LEDGER — EVERY POINT ACCOUNTED FOR</div>
     <div class="ledger">
       ${(i.factors||[]).map(f=>`<div class="lr"><span class="lname">${esc(f.label)}</span>
         <span class="ldet">${esc(f.detail)}</span>
         <span class="ldelta ${f.delta>=0?'pos':'neg'}">${f.delta>=0?'+':''}${f.delta}</span></div>`).join('')}
       <div class="lr total"><span class="lname">Composite</span><span class="ldet">clamped to 0–100</span>
         <span class="ldelta">${i.risk}</span></div>
     </div>
     ${dga?`<div class="sech">DGA CLASSIFIER COMPONENTS — "${esc(parts.sld)}"</div>
       ${dga.components.map(c=>`<div class="brow"><div class="bl"><span>${c.key}</span><span>${c.value} × ${c.weight}</span></div>
         <div class="bar"><i data-w="${Math.round(c.value*100)}" style="background:${c.value>.6?'#e73b0d':c.value>.35?'#fbc856':'#7f9e6a'}"></i></div>
         <div class="hint" style="margin-top:3px">${esc(c.detail)}</div></div>`).join('')}
       <div class="note">Weighted total ${dga.score} — the classifier output used above.</div>`:''}
     ${i.type==='ipv4'?`<div class="sech">ADDRESS</div><div class="note">${esc(S.ipClassify(i.value).scope)} space${S.ipClassify(i.value).routable?' — globally routable':' — not routable on the public internet'}.</div>`:''}
     ${linked.length?`<div class="sech">RULES THAT MATCHED</div>${linked.map(a=>`<div class="list-row" data-alert="${esc(a.id)}">
       <span class="sevbar" style="background:${SEVC[a.severity]}"></span><span class="lname2">${esc(a.rule)}</span>
       <span class="lmeta">${esc(a.ruleId)}</span></div>`).join('')}`:'<div class="sech">RULES</div><div class="hint">No enabled rule matched this indicator.</div>'}
     <div class="acts">
       <button class="btn" data-benign="${esc(i.key)}">${i.benign?'Restore to scoring':'Mark benign (score 0)'}</button>
       <button class="btn" data-copyval="${esc(i.value)}">Copy</button>
       <button class="btn danger" data-delioc="${esc(i.key)}">Delete</button>
     </div>
   </div>`;
  showFly();
  requestAnimationFrame(()=>{const a=$('#arc'); if(a){a.style.transition='stroke-dashoffset .9s cubic-bezier(.22,1,.36,1)';a.style.strokeDashoffset=C-(i.risk/100)*C;}
    $$('#fly [data-w]').forEach(el=>el.style.width=el.dataset.w+'%');});
}
function openAlert(id){
  const a=WS.alerts.find(x=>x.id===id); if(!a)return;
  $('#fly').innerHTML=`
   <div class="fly-h"><button class="fly-x" data-close>✕</button>
     <span class="tag ${SEVT[a.severity]}">${a.severity.toUpperCase()}</span>
     <h3 style="font-size:15px;margin-top:8px">${esc(a.rule)}</h3>
     <div class="hint" style="margin-top:3px">${a.id} · ${a.ruleId} · raised ${rel(a.at)}</div></div>
   <div class="fly-b">
     <div class="kv"><div><u>INDICATOR</u><b>${esc(a.indicator)}</b></div><div><u>TYPE</u><b>${a.type}</b></div>
       <div><u>RISK</u><b>${a.risk}</b></div><div><u>ATT&CK</u><b>${a.technique}</b></div></div>
     <div class="sech">MATCHING EXPRESSION</div>
     <div class="term" style="max-height:none">${esc(a.expr)}</div>
     <div class="sech">EVIDENCE</div>
     <div class="note">${a.reasons.map(r=>'<div style="margin-bottom:6px">'+esc(r)+'</div>').join('')}</div>
     <div class="sech">STATUS</div>
     <div class="chips">${['open','triaged','resolved','false_positive'].map(s=>
       `<span class="chip${a.status===s?' on':''}" data-status="${esc(a.id)}|${s}">${s.replace('_',' ')}</span>`).join('')}</div>
     <div class="acts"><button class="btn" data-ioc-from-alert="${esc(a.indicator)}">Open indicator</button></div>
   </div>`;
  showFly();
}
function showFly(){ $('#fly').classList.add('on'); $('#scrim').classList.add('on'); wire(); }
function closeFly(){ $('#fly').classList.remove('on'); $('#scrim').classList.remove('on'); }

/* ── wiring ───────────────────────────────────────────────────────────── */
const state={iocType:'all'};
function wire(){
  $$('[data-goto]').forEach(b=>b.onclick=()=>go(b.dataset.goto));
  $$('[data-ioc]').forEach(r=>r.onclick=()=>openIoc(r.dataset.ioc));
  $$('[data-alert]').forEach(r=>r.onclick=()=>openAlert(r.dataset.alert));
  $$('[data-close]').forEach(b=>b.onclick=closeFly);
  $$('[data-ftype]').forEach(c=>c.onclick=()=>{state.iocType=c.dataset.ftype;render();});
  $$('[data-node]').forEach(n=>{
    n.onclick=()=>{selNode=n.dataset.node;render();};
    n.onmouseenter=()=>$$('.gedge').forEach(e=>{const p=e.parentNode.dataset.edge.split('|');
      e.classList.toggle('lit',p.includes(n.dataset.node)); e.classList.toggle('dim',!p.includes(n.dataset.node));});
    n.onmouseleave=()=>$$('.gedge').forEach(e=>{e.classList.remove('lit');e.classList.remove('dim');});
  });
  $$('[data-node2]').forEach(n=>n.onclick=()=>{selNode=n.dataset.node2;render();});
  $$('[data-rule]').forEach(sw=>sw.onclick=()=>{const i=+sw.dataset.rule;WS.rules[i].enabled=!WS.rules[i].enabled;
    recomputeAlerts();persist();render();toast('Rule '+(WS.rules[i].enabled?'enabled':'disabled'));});
  $$('[data-delrule]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();WS.rules.splice(+b.dataset.delrule,1);
    recomputeAlerts();persist();render();toast('Rule removed');});
  $$('[data-benign]').forEach(b=>b.onclick=()=>{
    const i=WS.indicators.find(x=>x.key===b.dataset.benign); if(!i)return;
    i.benign=!i.benign;
    const sc=S.scoreIndicator({type:i.type,value:i.value},{source:(i.sources||['analyst'])[0],sightings:i.sightings});
    i.risk=i.benign?0:sc.risk; i.severity=i.benign?'low':sc.severity; i.factors=i.benign?[{label:'Analyst decision',delta:0,detail:'marked benign — excluded from scoring and rules'}]:sc.factors;
    recomputeAlerts();persist();closeFly();render();toast(i.benign?'Marked benign':'Restored to scoring');});
  $$('[data-delioc]').forEach(b=>b.onclick=()=>{
    WS.indicators=WS.indicators.filter(x=>x.key!==b.dataset.delioc);
    recomputeAlerts();persist();closeFly();render();toast('Indicator deleted');});
  $$('[data-copyval]').forEach(b=>b.onclick=()=>copy(b.dataset.copyval,'Copied'));
  $$('[data-ioc-from-alert]').forEach(b=>b.onclick=()=>{
    const i=WS.indicators.find(x=>x.value===b.dataset.iocFromAlert); if(i)openIoc(i.key);});
  $$('[data-status]').forEach(c=>c.onclick=()=>{
    const [id,st]=c.dataset.status.split('|'); const a=WS.alerts.find(x=>x.id===id);
    if(a){a.status=st;persist();openAlert(id);render();toast('Alert marked '+st.replace('_',' '));}});
  $$('[data-tech]').forEach(c=>c.onclick=()=>{
    const hits=WS.alerts.filter(a=>a.technique===c.dataset.tech);
    toast(hits.length?c.dataset.tech+': '+hits.length+' alert(s) — '+hits[0].rule:c.dataset.tech+': no alerts yet');});
  $$('[data-dl]').forEach(b=>b.onclick=()=>download(b.dataset.dl));
  $$('[data-copy]').forEach(b=>b.onclick=()=>{
    if(b.dataset.copy==='stix') copy(JSON.stringify(S.toStix(WS.indicators.filter(i=>!i.benign),{producer:'SkyRecon'}),null,2),'STIX bundle copied');
    else copy(WS.indicators.filter(i=>!i.benign).map(i=>defang(i.value)).join('\n'),'Defanged list copied');});
  const rr=$('#reRun'); if(rr) rr.onclick=()=>{recomputeAlerts();persist();render();toast('Rules re-evaluated over '+WS.indicators.length+' indicators');};
  const qi=$('#quickIngest'); if(qi) qi.onclick=()=>go('ingest');
  const wp=$('#wipe'); if(wp) wp.onclick=()=>{
    if(!confirm('Delete every indicator, alert, event and custom rule in this workspace?'))return;
    WS.indicators=[];WS.alerts=[];WS.events=[];WS.ingests=[];WS.rules=S.DEFAULT_RULES.map(r=>({...r}));WS.analysis=null;
    persist();render();toast('Workspace cleared');};
  $('#scrim').onclick=closeFly;
}

const INIT={};
INIT.ingest=()=>{
  const box=$('#pasteBox'), cc=$('#charCount');
  let source='report';
  $$('#srcSeg b').forEach(b=>b.onclick=()=>{$$('#srcSeg b').forEach(x=>x.classList.remove('on'));b.classList.add('on');source=b.dataset.s;});
  box.oninput=()=>cc.textContent=fmt(box.value.length)+' characters';
  $('#clearBox').onclick=()=>{box.value='';cc.textContent='0 characters';$('#ingestResult').innerHTML='';};
  $('#loadSample').onclick=()=>{box.value=SAMPLE;cc.textContent=fmt(SAMPLE.length)+' characters';toast('Example loaded — press Analyse to run it');};
  $('#runIngest').onclick=()=>{
    const text=box.value.trim();
    if(!text){toast('Paste something to analyse first');box.focus();return;}
    const label=(text.split('\n')[0]||'').slice(0,48)||'pasted input';
    const {rec,ex,logs}=ingest(text,source,label);
    renderIngestResult(rec,ex,logs);
    buildNav(); paintStore();
    toast(rec.added+' new indicator'+(rec.added===1?'':'s')+', '+rec.parsedEvents+' event'+(rec.parsedEvents===1?'':'s')+' parsed in '+rec.ms+'ms');
  };
  const dz=$('#dropZone');
  dz.onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.txt,.log,.csv,.json,.md';
    inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
      r.onload=()=>{box.value=r.result;cc.textContent=fmt(box.value.length)+' characters';toast('Loaded '+f.name);};r.readAsText(f);};inp.click();};
  ['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over');}));
  dz.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{box.value=r.result;cc.textContent=fmt(box.value.length)+' characters';toast('Loaded '+f.name);};r.readAsText(f);});
};
INIT.rules=()=>{
  const ex=$('#newExpr'), msg=$('#parseMsg'), mc=$('#matchCount');
  const check=()=>{
    const v=ex.value.trim();
    if(!v){ex.classList.remove('bad');msg.className='parse-msg';msg.textContent='Fields: type, value, host, risk, confidence, dga, entropy, tld, tld_risk, phish_words, homograph_flags, subdomain_depth, scheme, ip_host, risky_extension, nonstandard_port, has_credentials, cve_age, length';mc.textContent='';return null;}
    try{
      const ast=S.parseRule(v);
      ex.classList.remove('bad'); msg.className='parse-msg parse-ok'; msg.textContent='✓ parses cleanly';
      const live=WS.indicators.filter(i=>!i.benign);
      let hits=0;
      live.forEach(i=>{const ctx=S.ruleContext({type:i.type,value:i.value},{risk:i.risk,confidence:i.confidence,severity:i.severity,factors:i.factors||[]});
        try{ if(S.evalRule(ast,ctx)) hits++; }catch(e){}});
      mc.textContent=live.length?(hits+' of '+live.length+' current indicators match'):'no indicators to test against yet';
      return ast;
    }catch(e){ ex.classList.add('bad'); msg.className='parse-msg parse-bad'; msg.textContent='✗ '+e.message; mc.textContent=''; return null; }
  };
  ex.oninput=check;
  $('#addRule').onclick=()=>{
    const name=$('#newName').value.trim()||'Untitled rule';
    if(!check())  { toast('Fix the expression before adding the rule'); return; }
    const id='R-'+String(900+WS.rules.filter(r=>r.custom).length+1);
    WS.rules.push({id,name,expr:ex.value.trim(),severity:$('#newSev').value,technique:($('#newTech').value.trim()||'T1071'),enabled:true,custom:true});
    recomputeAlerts(); persist(); render(); toast('Rule added and evaluated');
  };
};

/* ── ingest result ────────────────────────────────────────────────────── */
function renderIngestResult(rec,ex,logs){
  const scored=ex.indicators.map(i=>{
    const r=WS.indicators.find(x=>x.key===i.type+'|'+i.value.toLowerCase());
    return {...i,risk:r?r.risk:0,severity:r?r.severity:'low',key:r?r.key:''};
  }).sort((a,b)=>b.risk-a.risk);
  $('#ingestResult').innerHTML=`
  <div style="height:12px"></div>
  <div class="strip" style="grid-template-columns:repeat(5,1fr)">
    ${[['EXTRACTED',rec.extracted],['FILTERED OUT',rec.dropped],['NEW',rec.added],['LOG EVENTS',rec.parsedEvents],['ELAPSED',rec.ms+'ms']]
      .map(m=>`<div class="mt"><div class="mt-l">${m[0]}</div><div class="mt-v">${m[1]}</div></div>`).join('')}
  </div>
  <div class="grid g21">
    <div class="pan"><div class="pan-h"><h3>Indicators found</h3><span class="hint">SCORED ON INGEST</span></div>
      <div class="pan-b flush">${scored.length?`<div class="tw"><table>
      <thead><tr><th>INDICATOR</th><th>TYPE</th><th>RISK</th><th>SEEN IN TEXT</th></tr></thead><tbody>
      ${scored.map(i=>`<tr data-ioc="${esc(i.key)}"><td><span class="sevbar" style="background:${SEVC[i.severity]}"></span><span class="val">${esc(trunc(i.value,46))}</span></td>
        <td class="mono hint">${i.type.toUpperCase()}</td>
        <td><span class="rb"><u><i data-w="${i.risk}" style="background:${SEVC[i.severity]}"></i></u><b>${i.risk}</b></span></td>
        <td class="mono hint">${i.count}×</td></tr>`).join('')}</tbody></table></div>`
      :'<div class="pan-b">'+noneYet('No indicators in that text.')+'</div>'}</div></div>
    <div>
      ${ex.dropped.length?`<div class="pan"><div class="pan-h"><h3>Filtered out</h3><span class="hint">${ex.dropped.length}</span></div>
        <div class="pan-b" style="max-height:220px;overflow-y:auto">${ex.dropped.map(d=>`<div class="list-row" style="cursor:default">
          <span class="lname2 mono" style="font-size:11px">${esc(trunc(d.value,24))}${d.count>1?' <span class="hint">×'+d.count+'</span>':''}</span><span class="lmeta">${esc(d.reason)}</span></div>`).join('')}</div></div>
        <div style="height:12px"></div>`:''}
      ${logs.events.length?`<div class="pan"><div class="pan-h"><h3>Log parsing</h3></div><div class="pan-b">
        ${Object.entries(logs.formats).map(([f,n])=>`<div class="list-row" style="cursor:default"><span class="lname2">${esc(f)}</span><span class="lmeta">${n} lines</span></div>`).join('')}
        ${logs.unparsed.length?`<div class="note" style="margin-top:9px">${logs.unparsed.length} line(s) did not match any known format — line ${logs.unparsed[0].line}: <span class="mono">${esc(trunc(logs.unparsed[0].text,48))}</span></div>`:''}
      </div></div>`:''}
    </div>
  </div>`;
  requestAnimationFrame(()=>$$('#ingestResult [data-w]').forEach(el=>el.style.width=el.dataset.w+'%'));
  wire();
}

/* ── export ───────────────────────────────────────────────────────────── */
function defang(v){ return String(v).replace(/\./g,'[.]').replace(/^http/i,'hxxp').replace(/:\/\//,'[://]'); }
async function download(kind){
  const live=WS.indicators.filter(i=>!i.benign);
  let name,data;
  if(kind==='stix'){ name='skyrecon-indicators.stix.json'; data=JSON.stringify(S.toStix(live,{producer:'SkyRecon'}),null,2); }
  else if(kind==='ioc'){ name='skyrecon-indicators.csv';
    data=S.toCsv(live.map(i=>({indicator:i.value,type:i.type,risk:i.risk,confidence:i.confidence,severity:i.severity,
      sightings:i.sightings,sources:(i.sources||[]).join('|'),first_seen:new Date(i.firstSeen).toISOString(),
      last_seen:new Date(i.lastSeen).toISOString(),rationale:(i.factors||[]).map(f=>f.label+' '+(f.delta>=0?'+':'')+f.delta).join('; ')})),
      ['indicator','type','risk','confidence','severity','sightings','sources','first_seen','last_seen','rationale']); }
  else if(kind==='alerts'){ name='skyrecon-alerts.csv';
    data=S.toCsv(WS.alerts.map(a=>({alert_id:a.id,rule_id:a.ruleId,rule:a.rule,severity:a.severity,indicator:a.indicator,
      type:a.type,risk:a.risk,technique:a.technique,status:a.status,expression:a.expr,evidence:(a.reasons||[]).join(' | ')})),
      ['alert_id','rule_id','rule','severity','indicator','type','risk','technique','status','expression','evidence']); }
  else { name='skyrecon-workspace.json'; data=JSON.stringify({indicators:WS.indicators,alerts:WS.alerts,rules:WS.rules,ingests:WS.ingests,meta:WS.meta},null,2); }

  try{
    const dl=await claude.use('downloads');
    if(dl){ await dl.save({filename:name,data}); toast('Saved '+name); return; }
  }catch(e){ /* viewer declined or capability unavailable */ }
  copy(data,'Download unavailable here — '+name+' copied to clipboard instead');
}
function copy(text,msg){
  navigator.clipboard.writeText(text).then(()=>toast(msg||'Copied'),()=>toast('Clipboard blocked by the browser'));
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),200);},3000);}
